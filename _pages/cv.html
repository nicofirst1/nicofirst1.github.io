---
layout: default
title: CURRICULUM VITAE
page_id: cv
---
<section class="w-full px-5 section_cv">
    <h1 class="text-center text-3xl md:text-5xl font-bold mt-16 md:mt-20">{{page.title}}</h1>

    {%- assign cv_pdf = site.baseurl | append: "/assets/data/NicoloBrandizziCV.pdf" -%}

    {%- comment %} Desktop: inline PDF embed. Mobile browsers rasterize <object> PDFs into a
         blurry low-res preview, so it's hidden below md and replaced by the card below. {% endcomment -%}
    <object class="cv_embed mx-auto mt-8 max-w-6xl rounded-xl"
            data="{{ cv_pdf }}" type="application/pdf" width="100%" height="1200px">
      <p>Unable to display PDF file. <a href="{{ cv_pdf }}">Download</a> instead.</p>
    </object>

    {%- comment %} Mobile: native-viewer card. Inline embeds render pixelated on phones, so
         tapping opens the device's built-in PDF viewer (crisp, with pinch-zoom). {% endcomment -%}
    <div class="cv_card mx-auto mt-10 max-w-sm rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg p-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-indigo-50 dark:bg-indigo-500/15 text-3xl">📄</div>
      <p class="text-lg font-semibold text-slate-900 dark:text-slate-100">Curriculum Vitae</p>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Inline previews look blurry on phones. Open it in your device's PDF viewer for a crisp, zoomable copy.
      </p>
      <div class="mt-6 flex flex-col gap-3">
        <a href="{{ cv_pdf }}" target="_blank" rel="noopener"
           class="inline-flex items-center justify-center rounded-full bg-indigo-600 px-5 py-3 text-sm font-semibold text-white hover:bg-indigo-700 transition-colors">
          Open CV &#8599;
        </a>
        <a href="{{ cv_pdf }}" download
           class="inline-flex items-center justify-center rounded-full border border-slate-300 dark:border-slate-600 px-5 py-3 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
          Download PDF
        </a>
      </div>
    </div>
</section>
