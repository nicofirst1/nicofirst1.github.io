name: Substack syndication reminder

# When a new blog post is pushed, open a GitHub issue with everything needed to
# syndicate it to Substack: the import page + a single-post RSS feed for that
# post. Fires only for newly ADDED _blog/ posts, so editing an old post won't nag.
on:
  push:
    branches: [ "master" ]
    paths:
      - "_blog/**"
  workflow_dispatch:
    inputs:
      file:
        description: "Path to a _blog/*.md post to syndicate (manual run)"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect newly added posts
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ADDED="${{ github.event.inputs.file }}"
          else
            BEFORE='${{ github.event.before }}'
            if ! git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
            fi
            if [ -z "$BEFORE" ]; then
              ADDED="$(git diff --diff-filter=A --name-only "$(git rev-parse HEAD)" -- '_blog/*.md' || true)"
            else
              ADDED="$(git diff --diff-filter=A --name-only "$BEFORE" '${{ github.sha }}' -- '_blog/*.md' || true)"
            fi
          fi
          {
            echo "files<<EOF"
            echo "$ADDED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open syndication issue(s)
        if: ${{ contains(steps.detect.outputs.files, '_blog/') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const SITE   = 'https://nicolobrandizzi.com';
            const IMPORT = 'https://nicolobrandizzi.substack.com/publish/import';
            const files = `${{ steps.detect.outputs.files }}`
              .split('\n').map(s => s.trim()).filter(Boolean);
            for (const f of files) {
              if (!fs.existsSync(f)) { core.warning(`${f} not found, skipping`); continue; }
              const src = fs.readFileSync(f, 'utf8');
              const slug  = (src.match(/^slug:\s*["']?(.+?)["']?\s*$/m) || [])[1];
              const title = (src.match(/^title:\s*["']?(.+?)["']?\s*$/m) || [])[1] || slug || f;
              if (!slug) { core.warning(`No slug in ${f}, skipping`); continue; }
              const feed = `${SITE}/feed-substack/${slug}.xml`;
              const post = `${SITE}/blog/${slug}/`;
              const body = [
                `New post is live on the site — syndicate it to Substack.`,
                ``,
                `**Post:** [${title}](${post})`,
                ``,
                `## Steps`,
                `1. Open the Substack importer: ${IMPORT}`,
                `2. Import from this **single-post** RSS feed (creates one draft, never re-imports the back-catalog):`,
                `   \`\`\``,
                `   ${feed}`,
                `   \`\`\``,
                `3. Review the draft: images load, footnotes render as a **Notes** endnote block, and the "📍 Originally published at nicolobrandizzi.com" line sits just under the TL;DR.`,
                `4. Publish web-only, then send as email + share to Notes.`,
                `5. The site→Substack backlink is **automatic** — the \`Substack backlinks\` workflow probes the post's Substack URL daily and adds it to \`_data/substack.yml\` once live. Run that workflow manually (Actions → Substack backlinks → Run workflow) to publish the backlink immediately.`,
                ``,
                `> _Substack self-canonicalizes — there is no canonical-back, and that's expected. Attribution is the in-body backlink. See \`CLAUDE.md\` → Substack syndication._`,
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Syndicate to Substack: ${title}`,
                body,
              });
              core.info(`Opened syndication issue for ${slug}`);
            }
