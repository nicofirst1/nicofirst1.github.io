<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2410"/>
      <stop offset="0.55" stop-color="#3d1908"/>
      <stop offset="1" stop-color="#2a1106"/>
    </linearGradient>
    <marker id="loopArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fdba74"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- kicker -->
  <rect x="80" y="74" width="44" height="4" rx="2" fill="#f97316"/>
  <text x="80" y="118" fill="#fdba74" font-size="25" font-weight="700" letter-spacing="6">KLARTEXT<tspan fill="#e9c4a8" letter-spacing="3" font-weight="600">   ·   FRAUNHOFER IAIS</tspan></text>

  <!-- title -->
  <text x="78" y="282" fill="#fff7ed" font-size="92" font-weight="800" letter-spacing="-1">Agents that know</text>
  <text x="78" y="384" fill="#fdba74" font-size="92" font-weight="800" letter-spacing="-1">when to stop</text>

  <!-- subline + descriptor -->
  <text x="82" y="462" fill="#f8d9bf" font-size="31" font-weight="600">Amtsdeutsch  →  Leichte Sprache</text>
  <text x="82" y="506" fill="#cca588" font-size="22">A bounded, auditable four-agent translator.</text>

  <!-- quiet loop motif (bottom-right) -->
  <g>
    <line x1="946" y1="546" x2="1126" y2="546" stroke="#9a6b48" stroke-width="3"/>
    <circle cx="946"  cy="546" r="8" fill="#fdba74"/>
    <circle cx="1006" cy="546" r="8" fill="#fdba74"/>
    <circle cx="1066" cy="546" r="8" fill="#fdba74"/>
    <circle cx="1126" cy="546" r="8" fill="#fdba74"/>
    <path d="M1126 540 C 1126 500, 946 500, 946 540" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#loopArr)"/>
    <text x="1036" y="582" text-anchor="middle" fill="#b08862" font-size="15" letter-spacing="1">bounded loop</text>
  </g>
</svg>
